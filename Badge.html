<html lang="en">
<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    "https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js">

<body>
            <div class="container text-center">
                <h1 style="color: orange;">Thanks For Visiting!</h1>
                <p>We hope you found what you were looking for. Look at the badges below this text, those are rewarded to you!</p>

            <span class="badge badge-danger">Angry</span>

            <span class="badge badge-success">Happy</span>

            <span class="badge badge-dark">Frightened</span>
        </div>
