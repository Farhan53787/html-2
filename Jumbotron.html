<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumbotron</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src=
    "https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js">
    </script>
</head>
<body>
    <body style="text-align:center;">
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1 style="color: orange;">Thanks For Visiting!</h1>
                <p>We hope you found what you were looking for. Click the buttons below to satisfy yourself!</p>
            </div>
            <button type="button" class="btn btn-danger">Danger-Red</button>
            <button type="button" class="btn btn-warning">Warning-Yellow</button>
            <button type="button" class="btn btn-success">Success-Green</button>
            <button type="button" class="btn btn-info">Info-Sky</button>
            <button type="button" class="btn btn-dark">Dark-Black</button>
        </div>
</body>
</html>
