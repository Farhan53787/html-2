<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Full Width Container</title>
</head>
<body>
    <div class="container-fluid bg-info text-white text-center border border-bottom-0 border-success" style="border-width: 100px;">
        <h1>Bootstrap</h1>
        <p>Bootstrap is a popular front-end framework </p>
        <p>for developing responsive and mobile-first websites.</p>
    </div>
    <div class="container-fluid bg-warning text-white text-center border border-top-0 border-bottom-0 border-success mb-5 p-5 my-7">
        <h1>Warning</h1>
        <img src="download.jpeg" alt="Fire" class="img-fluid mb-3">
        <p>Keep away from fire</p>
        <p>Fire is dangerous!</p>
    </div>
    <div class="container-fluid bg-success text-white text-center border border-top-0 border-danger mb-5 p-5 my-5">
        <h1>Success</h1>
        <p>You are safe!</p>
        <p>Fire is under control!</p>
    </div>
</body>
</html>
